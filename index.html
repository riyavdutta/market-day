<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Day</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Market Day: run a stall at a Himalayan hill market. Original cast, original world. */
:root{--ink:#5b3a2e;--cream:#fff8ea;--paper:#fffdf6;--b:#800020;--honey:#f2a91c;--grass:#8fd16a;--grass2:#7cc35a;--sky1:#8fd8ff;--sky2:#fff1d6;
  --font:'Fredoka',system-ui,sans-serif;--spring:cubic-bezier(.2,.9,.3,1.35);--ease:cubic-bezier(.2,.7,.2,1);--dusk:0}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#7cc35a;font-family:var(--font);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}

/* the world */
.stage{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.stage::-webkit-scrollbar{display:none}
.scene{display:block;height:100%;aspect-ratio:16/10;min-width:100%}
.ol{stroke:var(--ink);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.8deg)}}
.flag{transform-box:fill-box;transform-origin:50% 0;animation:flap 1.6s ease-in-out infinite}
@keyframes flap{50%{transform:skewX(9deg) scaleY(.92)}}
.shimmer{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:18 60;opacity:.75;animation:flow 3s linear infinite}
@keyframes flow{to{stroke-dashoffset:-156}}
.bfly .w{transform-box:fill-box;transform-origin:100% 50%;animation:flapw .25s ease-in-out infinite alternate}
.bfly .w.r{transform-origin:0 50%}
@keyframes flapw{to{transform:scaleX(.25)}}
.bfly{animation:flit 14s ease-in-out infinite}
@keyframes flit{0%{transform:translate(0,0)}25%{transform:translate(160px,-60px)}50%{transform:translate(260px,30px)}75%{transform:translate(90px,80px)}100%{transform:translate(0,0)}}
.petal{fill:#ff7aa2;animation:fall 9s linear infinite}
@keyframes fall{0%{transform:translate(0,-60px) rotate(0)}100%{transform:translate(-160px,1100px) rotate(720deg)}}
.smoke circle{fill:#fff;opacity:0;animation:smoke 4s ease-out infinite}
.smoke circle:nth-child(2){animation-delay:1.3s}.smoke circle:nth-child(3){animation-delay:2.6s}
@keyframes smoke{0%{opacity:.8;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(20px,-80px) scale(1.7)}}
.tag{transform-box:fill-box;transform-origin:50% 0;animation:swing 2.4s ease-in-out infinite}
@keyframes swing{50%{transform:rotate(7deg)}}
.awn{transform-box:fill-box;transform-origin:50% 0;animation:awn 3s ease-in-out infinite}
@keyframes awn{50%{transform:scaleY(1.06)}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.walker{transition:transform var(--wt,3s) linear}
.walker.walking .inner{animation:hopw .32s ease-in-out infinite alternate}
@keyframes hopw{to{transform:translateY(-9px) rotate(2deg)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.emote{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform .35s var(--spring)}
.emote.on{transform:scale(1)}
.cloth{transition:transform 1s var(--ease)}
.opened .cloth{transform:translateY(-150px) scaleY(.15)}
.coin{font:700 34px var(--font);fill:var(--honey);stroke:var(--ink);stroke-width:2;paint-order:stroke;animation:coin 1.4s var(--ease) forwards}
@keyframes coin{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-110px);opacity:0}}
.goods{cursor:pointer}
.goods:hover .gitem{transform:translateY(-6px)}
.gitem{transform-box:fill-box;transition:transform .25s var(--spring)}
.board{cursor:pointer}
.board:hover .bd{transform:rotate(-2deg)}
.bd{transform-box:fill-box;transform-origin:50% 100%;transition:transform .25s var(--spring)}
.chalk{font:600 26px var(--font);fill:#fff8ea}
.dusk{fill:#ff7a45;mix-blend-mode:multiply;opacity:var(--dusk);transition:opacity 2s;pointer-events:none}
.sun{transition:transform 1s linear}

/* the HUD */
.hud{position:fixed;top:14px;z-index:30;display:flex;gap:10px;align-items:center}
.hud.l{left:14px}.hud.r{right:14px}
.pill{background:var(--paper);border-radius:999px;padding:8px 16px 8px 10px;box-shadow:0 6px 0 #0000001f,0 0 0 4px var(--ink) inset;font:600 18px var(--font);display:flex;gap:8px;align-items:center}
.pill .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--honey);color:var(--ink);font:700 16px var(--font);box-shadow:0 0 0 3px var(--ink) inset}
.pill.title{background:var(--b);color:#fff8ea;box-shadow:0 6px 0 #0000001f}
.pill.title b{font-weight:700}
.purse .ic{background:#ffd34d}
button.pill{border:0;padding:8px 12px 8px 10px}
.snd .ic{background:#bfe9ff}
.snd[aria-pressed="false"] .ic{background:#e9dccb;color:#9a7b62}
.bump{animation:bump .5s var(--spring)}
@keyframes bump{40%{transform:scale(1.18)}}

/* dialogue: a fat rounded bubble with a tilted name tag */
.talk{position:fixed;left:50%;top:74px;translate:-50% 0;z-index:40;width:min(700px,calc(100% - 20px));background:var(--paper);border-radius:34px;padding:26px 30px 18px;
  box-shadow:0 0 0 5px var(--ink),0 10px 0 5px #0000001f;transition:opacity .25s,transform .4s var(--spring)}
.talk.hide{opacity:0;transform:translateY(-30px) scale(.95);pointer-events:none}
.talk .who{position:absolute;left:28px;top:-20px;rotate:-4deg;background:var(--c,var(--b));color:var(--fg,#fff8ea);font:700 18px var(--font);padding:6px 18px;border-radius:999px;box-shadow:0 0 0 4px var(--ink)}
.talk p{font:500 clamp(18px,2.2vw,22px)/1.45 var(--font);min-height:2.9em}
.talk .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{border:0;border-radius:999px;padding:12px 22px;font:700 17px var(--font);background:var(--b);color:#fff8ea;box-shadow:0 5px 0 #4a0013;transition:transform .15s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #4a0013}
.btn.soft{background:var(--paper);color:var(--b);box-shadow:0 0 0 3px var(--b) inset,0 5px 0 #0000001f}
.talk .next{margin-left:auto;font:700 22px var(--font);color:var(--b);animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(4px)}}
.principle{display:inline-block;margin-top:8px;background:#ffe9a8;border-radius:999px;padding:3px 12px;font:600 13px var(--font);box-shadow:0 0 0 2px var(--ink) inset}

/* the ledger: a red cloth bahi-khata */
.ledger{position:fixed;inset:0;z-index:60;background:#2a1a1e99;display:none;align-items:center;justify-content:center;padding:16px}
.ledger.on{display:flex}
.book{width:min(940px,100%);max-height:calc(100dvh - 40px);overflow:hidden;display:flex;flex-direction:column;background:#b3122e;border-radius:26px;padding:16px;box-shadow:0 0 0 5px var(--ink),0 14px 0 5px #0000002a;animation:open .6s var(--spring)}
@keyframes open{from{transform:scale(.8) rotate(-4deg);opacity:0}}
.pages{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1 1 auto;min-height:0;overflow:auto;background:#fff6e0;border-radius:16px;box-shadow:0 0 0 4px var(--ink)}
.page{padding:22px 24px;background:repeating-linear-gradient(transparent 0 33px,#e9d7b4 33px 34px)}
.page h2{font:700 28px var(--font);color:var(--b);margin-bottom:6px}
.page small{font:600 13px var(--font);color:#9a7b62}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0}
.row i{width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--ink);display:grid;place-items:center;font:700 14px var(--font);font-style:normal;color:#fff8ea}
.row b{font:600 17px var(--font)}.row span{font:700 18px var(--font);color:var(--b)}
.row.no span{color:#b8a48f}
.why{padding:10px 0;border-bottom:2px dashed #e0c89e;font:500 16px/1.4 var(--font)}
.why .principle{margin:0 0 4px}
.total{display:flex;justify-content:space-between;margin-top:12px;font:700 22px var(--font);color:var(--b)}
.sum{flex:none;margin:12px 6px 0;color:#fff8ea;font:600 18px/1.4 var(--font);text-align:center}
.stk{position:fixed;inset:0;z-index:75;background:#2a1a1ef2;display:none;align-items:center;justify-content:center;padding:16px}
.stk.on{display:flex}
.album{width:min(880px,100%);max-height:calc(100dvh - 32px);overflow:hidden;display:flex;flex-direction:column;background:#fff6e0;border-radius:26px;padding:20px 22px 18px;box-shadow:0 0 0 5px var(--ink),0 14px 0 5px #0000002a;animation:open .5s var(--spring)}
.album>small{font:600 14px var(--font);color:#9a7b62;letter-spacing:.5px}
.album h2{font:700 28px var(--font);color:var(--b);margin-top:2px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0 16px;padding:4px;flex:1 1 auto;min-height:0;overflow:auto}
.stc{background:#fffdf6;border-radius:18px;padding:12px 10px;text-align:center;box-shadow:0 0 0 3px #e0c89e}
.stc svg{width:88px;height:88px;display:block;margin:0 auto 6px}
.stc b{display:block;font:700 16px var(--font);color:var(--b)}
.stc span{display:block;font:500 13px/1.35 var(--font);color:var(--ink);margin-top:2px}
.stc.locked{background:#fbf3e3;box-shadow:0 0 0 3px #eadcc4}
.stc.locked b{color:#b8a48f}.stc.locked span{color:#9a7b62}
.newbuy{transform-box:fill-box;transform-origin:center;animation:stpop .5s var(--spring)}
.stc.new{animation:stpop .7s var(--spring)}
@keyframes stpop{0%{transform:scale(.5) rotate(-8deg)}100%{transform:none}}
.album .acts{flex:none;display:flex;justify-content:center}
@media (max-width:700px){.sgrid{grid-template-columns:repeat(2,1fr);gap:10px}.album{padding:16px 14px}.album h2{font-size:23px}}
.post{position:fixed;inset:0;z-index:70;background:#2a1a1ef2;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px;perspective:1600px}
.post.on{display:flex}
.card3d{width:min(760px,100%,calc((100vh - 170px) * 1.5));aspect-ratio:3/2;position:relative;transform-style:preserve-3d;transition:transform .8s var(--spring);cursor:pointer;animation:open .6s var(--spring)}
.card3d.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;overflow:hidden;background:#fffaf0;box-shadow:0 0 0 6px #fffaf0,0 0 0 10px var(--ink),0 18px 30px #0007}
.face svg{width:100%;height:100%;display:block}
.face.back{transform:rotateY(180deg)}
.flipnote{color:#fff8ea;font:500 15px var(--font);margin:6px 0 0}
.post .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.book .acts{flex:none;display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.prices{position:fixed;left:50%;bottom:16px;translate:-50% 0;z-index:45;width:min(440px,calc(100% - 20px));max-height:calc(100vh - 90px);overflow:auto;background:var(--paper);border-radius:28px;padding:18px 20px 16px;box-shadow:0 0 0 5px var(--ink),0 10px 0 5px #0000001f;display:none}
.prices.on{display:block;animation:open .45s var(--spring)}
@media (min-width:1000px){.prices{left:auto;right:20px;translate:none;width:400px}}
.prices h3{font:700 24px var(--font);color:var(--b)}
.prices>small{display:block;font:500 15px/1.35 var(--font);color:#9a7b62;margin:2px 0 8px}
.prow{display:grid;grid-template-columns:1fr auto 70px auto;gap:8px;align-items:center;padding:6px 8px;border-bottom:2px dashed #e0c89e;border-radius:12px;transition:background .4s}
.prow b{font:600 17px var(--font)}
.prow output{font:700 20px var(--font);color:var(--b);text-align:center}
.prow.hi{background:#fff0c4}
.step{width:38px;height:38px;border-radius:50%;border:0;background:var(--honey);font:700 22px/1 var(--font);color:var(--ink);box-shadow:0 0 0 3px var(--ink) inset,0 3px 0 #0000001f}
.step:active{transform:translateY(2px)}
.prices .btn{margin-top:12px;width:100%}
.prow.tg{grid-template-columns:1fr auto}
.prow.tg small{display:block;font:500 13px var(--font);color:#9a7b62}
.ptog{border:0;border-radius:999px;padding:8px 16px;font:700 15px var(--font);background:#e9dccb;color:var(--ink);box-shadow:0 0 0 3px var(--ink) inset}
.ptog[aria-pressed="true"]{background:var(--honey)}
.trayb{cursor:pointer}
.toast{position:fixed;left:50%;bottom:44px;translate:-50% 0;z-index:50;background:var(--paper);box-shadow:0 0 0 4px var(--ink);border-radius:22px;max-width:min(520px,calc(100% - 24px));text-align:center;padding:8px 16px;font:600 16px var(--font);opacity:0;transition:opacity .25s,transform .4s var(--spring);transform:translateY(-10px)}
.toast.on{opacity:1;transform:none}
@media (max-width:700px){.pages{grid-template-columns:1fr}.sum{font-size:15px}.book .acts .btn{padding:10px 16px;font-size:15px}.ledger{padding:10px}.pill{font-size:15px;padding:6px 12px 6px 8px}.pill .ic{width:24px;height:24px}.hud.l .pill.title{display:none}#sndtx{display:none}.talk{padding:24px 20px 14px}}
.snow{fill:#fff;animation:snowfall 12s linear infinite}
@keyframes snowfall{0%{transform:translate(0,-40px)}100%{transform:translate(-90px,1080px)}}
.conf{animation:fall 9s linear infinite}
.glowl{opacity:calc(.3 + var(--dusk) * 1.5);pointer-events:none}
.fwk{opacity:calc(var(--dusk) * 2.4);pointer-events:none}
.burst{transform-box:fill-box;transform-origin:center;animation:burst 2.6s ease-out infinite}
@keyframes burst{0%{transform:scale(.1);opacity:0}15%{opacity:1}70%{transform:scale(1);opacity:.9}100%{transform:scale(1.1);opacity:0}}
.kite{animation:kite 5s ease-in-out infinite}
@keyframes kite{50%{transform:translate(14px,-10px) rotate(4deg)}}
.ferris{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.steam circle{fill:#fff;opacity:0;transform-box:fill-box;animation:steam 2.6s ease-out infinite}
.steam circle:nth-child(2){animation-delay:.9s}.steam circle:nth-child(3){animation-delay:1.8s}
@keyframes steam{0%{opacity:.8;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-46px) scale(1.6)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage"><svg class="scene" id="w" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A hill market on a sunny morning"></svg></div>

<div class="hud l"><span class="pill title"><b>Market Day</b></span><span class="pill" id="clock"><span class="ic">☀</span><span id="time">8:30 am</span></span><button class="pill" id="stkp" type="button" aria-label="Sticker book"><span class="ic">★</span><span id="stkn">0/12</span></button></div>
<div class="hud r"><button class="pill snd" id="snd" type="button" aria-pressed="true" aria-label="Sound"><span class="ic">♪</span><span id="sndtx">On</span></button><span class="pill purse" id="purse"><span class="ic">₹</span><span id="money">0</span></span></div>
<div class="prices" id="prices" role="dialog" aria-label="Price tags"><h3>Price tags</h3><small>Every villager has a limit. The right sign, or the right price beside it, can stretch it.</small><div id="plist"></div><button class="btn" id="pdone" type="button">Done</button></div>
<div class="toast" id="toast"></div>
<div class="talk" id="talk" role="dialog" aria-live="polite"><span class="who" id="who">Riya</span><p id="say"></p><div class="acts" id="acts"></div></div>
<div class="stk" id="stk" role="dialog" aria-modal="true" aria-label="Sticker book"><div class="album"><small>STICKER BOOK</small><h2 id="stkh"></h2><div class="sgrid" id="sgrid"></div><div class="acts"><button class="btn" id="stkx" type="button">Back to the market</button></div></div></div>
<div class="post" id="post" role="dialog" aria-modal="true" aria-label="Your postcard"><div class="card3d" id="card3d" role="button" tabindex="0" aria-label="Your postcard. Tap to turn it over."><div class="face front" id="pf"></div><div class="face back" id="pb"></div></div><p class="flipnote">Tap the card to turn it over</p><div class="acts" id="pa"></div></div>
<div class="ledger" id="ledger" role="dialog" aria-modal="true" aria-label="Today's ledger"><div class="book"><div class="pages"><div class="page" id="lp"></div><div class="page" id="rp"></div></div><p class="sum" id="sum"></p><div class="acts" id="la"></div></div></div>

<script>
(function(){
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
// Day 1 is the first market; #day2 is Festival day, with new villagers and new tools
const DAY={'#day2':2,'#day3':3}[location.hash]||1,KP=DAY===1?'md-':'md'+DAY+'-',FEST=DAY===2,WINTER=DAY===3;
const DAYNAME=['','Market Day','Festival day','Winter market'];
if(DAY>1){document.title=DAYNAME[DAY]+' · Market Day';$('.pill.title b').textContent=DAYNAME[DAY]}
const NS='http://www.w3.org/2000/svg',W=$('#w');
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||W).appendChild(e);return e};
const g=(a,p)=>el('g',a||{},p);
const FUN=['#2f5bff','#00a36c','#7a3cff','#d02b8f','#00a9bd','#e3bd00','#ff7a45','#6cb800'];
const sh=(x,y,rx,p)=>el('ellipse',{cx:x,cy:y,rx,ry:rx*.32,fill:'#0000002a'},p);

/* ---------- textures ---------- */
const defs=el('defs',{});
defs.innerHTML=`
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd8ff"/><stop offset="1" stop-color="#fff1d6"/></linearGradient>
<pattern id="lawn" width="100" height="100" patternUnits="userSpaceOnUse">
  <rect width="100" height="100" fill="#8fd16a"/><rect width="50" height="50" fill="#97d772"/><rect x="50" y="50" width="50" height="50" fill="#97d772"/>
  <path d="M20 30 l-4 -9 M20 30 l0 -11 M20 30 l4 -9 M72 80 l-4 -9 M72 80 l0 -11 M72 80 l4 -9 M78 22 l-3 -7 M78 22 l3 -7" stroke="#6fbb52" stroke-width="3" stroke-linecap="round"/>
</pattern>
<pattern id="planks" width="40" height="22" patternUnits="userSpaceOnUse"><rect width="40" height="22" fill="#d39561"/><path d="M0 21 h40 M18 0 v21" stroke="#a86b43" stroke-width="2"/><circle cx="8" cy="10" r="1.6" fill="#a86b43"/></pattern>
<pattern id="stripe" width="60" height="10" patternUnits="userSpaceOnUse"><rect width="30" height="10" fill="#800020"/><rect x="30" width="30" height="10" fill="#fff8ea"/></pattern>`;

if(FEST){defs.querySelector('#sky').innerHTML='<stop offset="0" stop-color="#f6a3b5"/><stop offset=".55" stop-color="#ffc98f"/><stop offset="1" stop-color="#ffe9c4"/>';
  defs.querySelector('#lawn').innerHTML='<rect width="100" height="100" fill="#bcc964"/><rect width="50" height="50" fill="#c6d272"/><rect x="50" y="50" width="50" height="50" fill="#c6d272"/><path d="M20 30 l-4 -9 M20 30 l0 -11 M20 30 l4 -9 M72 80 l-4 -9 M72 80 l0 -11 M72 80 l4 -9" stroke="#9fae4e" stroke-width="3" stroke-linecap="round"/><circle cx="78" cy="22" r="3" fill="#e9a23b"/><circle cx="30" cy="76" r="3" fill="#d9603b"/>'}
if(WINTER){defs.querySelector('#sky').innerHTML='<stop offset="0" stop-color="#b9d3e8"/><stop offset="1" stop-color="#f4efe8"/>';
  defs.querySelector('#lawn').innerHTML='<rect width="100" height="100" fill="#f4f7fb"/><rect width="50" height="50" fill="#eaf0f6"/><rect x="50" y="50" width="50" height="50" fill="#eaf0f6"/><circle cx="22" cy="28" r="2.5" fill="#d3dfea"/><circle cx="74" cy="78" r="2.5" fill="#d3dfea"/><circle cx="80" cy="20" r="2" fill="#d3dfea"/>'}
/* ---------- sky, peaks, terraces ---------- */
el('rect',{x:0,y:0,width:1600,height:300,fill:'url(#sky)'});
const sun=g({class:'sun'});el('circle',{cx:1390,cy:90,r:56,fill:FEST?'#ffb347':'#ffd34d',class:'ol'},sun);
[[180,70],[620,50],[1000,96]].forEach(([x,y],i)=>{const c=g({style:'animation:drift '+(70+i*20)+'s linear infinite;animation-delay:'+(-i*25)+'s'});[[0,0,30],[30,-12,26],[58,0,24],[28,8,28]].forEach(([dx,dy,r])=>el('circle',{cx:x+dx,cy:y+dy,r,fill:FEST?'#ffe6ea':'#fff'},c))});
const st=document.createElement('style');st.textContent='@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1800px)}}';document.head.appendChild(st);

  if(key==='fox')return s===1?'Framing':null;
  return null}
function drawStkPill(){$('#stkn').textContent=STK.length+'/12'}
function award(k){if(!k||STK.includes(k))return;STK.push(k);newStk.push(k);try{localStorage.setItem('md-stickers',JSON.stringify(STK))}catch(e){}
  drawStkPill();sfx('sticker');const p=$('#stkp');p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump');toast('New sticker! '+STICKERS.find(x=>x.k===k).t)}
function stickerSVG(st,got,i){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','-60 -60 120 120');s.setAttribute('aria-hidden','true');
  const COL=['','#bfe6a8','#ffd2a1','#d7e8f5'][st.day];
  el('circle',{cx:0,cy:0,r:55,fill:'#fff',stroke:'#5b3a2e',"stroke-width":3},s);el('circle',{cx:0,cy:0,r:46,fill:got?COL:'#ece4d6'},s);
  if(!got){el('text',{x:0,y:17,"text-anchor":'middle',style:'font:700 48px Fredoka,sans-serif;fill:#cdbba2'},s).textContent='?';return s}
  if(!st.who){el('path',{d:'M0 26 C -44 -4 -26 -42 0 -20 C 26 -42 44 -4 0 26 Z',fill:'#e8336d',class:'ol'},s);return s}
  const cp=el('clipPath',{id:'stc'+i},s);el('circle',{cx:0,cy:0,r:46},cp);
  const v=g({'clip-path':`url(#stc${i})`},s),m=g({transform:'translate(0 44) scale(.44)'},v);CAST[st.who].draw(m);return s}
function showBook(){const gr=$('#sgrid');gr.innerHTML='';
  STICKERS.forEach((st,i)=>{const got=STK.includes(st.k),c=document.createElement('div');c.className='stc'+(got?'':' locked')+(newStk.includes(st.k)?' new':'');
    c.appendChild(stickerSVG(st,got,i));const b=document.createElement('b'),sp=document.createElement('span');
    b.textContent=got?st.t:'Not found yet';sp.textContent=got?st.d:st.who?'Meet '+CAST[st.who].name+' on '+DAYNAME[st.day]:'Win someone over, then see them again another day';c.append(b,sp);gr.appendChild(c)});
  $('#stkh').textContent=STK.length===12?'All 12! You’re a real shopkeeper now.':STK.length+' of 12 stickers';
  $('#stk').classList.add('on');sfx('clink');newStk=[]}
$('#stkx').onclick=()=>{sfx('tap');$('#stk').classList.remove('on')};
$('#stkp').onclick=()=>{sfx('tap');showBook()};
drawStkPill();

/* ---------- dusk: a postcard to keep ---------- */
const PV={x:270,y:230,w:1005,h:670};              // the part of the market the front shows
function postFront(){const f=W.cloneNode(true);f.removeAttribute('class');f.removeAttribute('id');f.setAttribute('viewBox',`${PV.x} ${PV.y} ${PV.w} ${PV.h}`);f.setAttribute('preserveAspectRatio','xMidYMid slice');f.setAttribute('aria-hidden','true');
  f.querySelectorAll('.walker,.dusk,.coin,.cloth').forEach(e=>e.remove());
  f.querySelectorAll('text').forEach(t=>{if(['tap!','Free taste?','Bundle?'].includes(t.textContent))t.parentNode.remove()});
  // everyone who bought from you poses in front of the stall
  const buyers=log.filter(l=>l.buy),row=g({},f),gap=128,x0=720-(buyers.length-1)*gap/2;
  buyers.forEach((l,i)=>{const v=g({transform:`translate(${x0+i*gap} ${856+(i%2)*10}) scale(.82)`},row);sh(0,6,40,v);CAST[l.key].draw(v);outfit(v,l.key);wear(v,l.key,l.buy)});
  // greetings from…
  const bn=g({},f),bx0=PV.x+28,by0=PV.y+26;el('rect',{x:bx0,y:by0,width:430,height:104,rx:24,fill:'#fffaf0',class:'ol'},bn);
  el('text',{x:bx0+26,y:by0+40,style:'font:500 24px Fredoka,sans-serif;fill:#9a7b62'},bn).textContent='Greetings from the';
  el('text',{x:bx0+26,y:by0+86,style:'font:700 44px Fredoka,sans-serif;fill:#800020'},bn).textContent=DAYNAME[DAY];
  return f}
// what worked, in everyday words rather than marketing terms
const PLAIN={'The decoy effect':'a big size that made the medium one look cheap','Scarcity':'saying only 3 were left','Social proof':'letting them see others buying','Anchoring':'a pricey piece beside a cheaper one',
  'Where it comes from':'saying it was made in the hills','Loyalty':'old customers coming back','Reciprocity':'free tastes','Loss aversion':'calling it the last day of the season',
  'Charm pricing':'prices ending in 9','Bundling':'a bundle of two things','A good cause':'giving a child a book with each sale','Framing':'shawls that last 10 winters'};
function wrapText(t,n){const w=t.split(' '),out=[];let line='';w.forEach(x=>{if((line+' '+x).trim().length>n){out.push(line.trim());line=x}else line+=' '+x});if(line.trim())out.push(line.trim());return out}
function postBack(){const b=document.createElementNS(NS,'svg');b.setAttribute('viewBox','0 0 1005 670');b.setAttribute('aria-hidden','true');
  const sold=log.filter(l=>l.buy),best=sold.slice().sort((a,c)=>c.n-a.n)[0];
  el('rect',{x:0,y:0,width:1005,height:670,fill:'#fffaf0'},b);
  for(let k=0;k<7;k++)el('path',{d:`M${30+k*140} 640 l40 -6`,stroke:'#f1e4cc',"stroke-width":2},b);
  el('path',{d:'M600 70 V600',stroke:'#d9c4a5',"stroke-width":3},b);
  // the note, in the shopkeeper's words
  const msg=['Dear friend,'].concat(wrapText(`Today I minded a stall at the ${DAYNAME[DAY].toLowerCase()}.`,30),
    wrapText(`${sold.length} of 5 villagers bought from me, and I took ₹${money.toLocaleString('en-IN')}.`,30),
    best?wrapText(`What worked best: ${PLAIN[best.why]||best.why.toLowerCase()}.`,30):['Nobody bought today. Tomorrow!'],
    ['','Come and see if you can beat me!']);
  msg.forEach((t,i)=>{el('text',{x:56,y:112+i*46,style:`font:${i?400:600} 29px Fredoka,sans-serif;fill:#5b3a2e`},b).textContent=t});
  // a stamp with your best customer on it
  const stx=812,sty=60,sw=150,shh=184,STC=['','#bfe6a8','#ffd2a1','#d7e8f5'][DAY];
  el('rect',{x:stx,y:sty,width:sw,height:shh,fill:'#fff'},b);
  for(let k=0;k<=10;k++){[[stx+k*sw/10,sty],[stx+k*sw/10,sty+shh]].forEach(([x,y])=>el('circle',{cx:x,cy:y,r:5,fill:'#fffaf0'},b))}
  for(let k=0;k<=12;k++){[[stx,sty+k*shh/12],[stx+sw,sty+k*shh/12]].forEach(([x,y])=>el('circle',{cx:x,cy:y,r:5,fill:'#fffaf0'},b))}
  el('rect',{x:stx+12,y:sty+12,width:sw-24,height:shh-24,fill:STC,stroke:'#5b3a2e',"stroke-width":2.5},b);
  if(best){const m=g({transform:`translate(${stx+sw/2} ${sty+140}) scale(.5)`},b);CAST[best.key].draw(m)}else el('circle',{cx:stx+sw/2,cy:sty+80,r:34,fill:'#ffd34d',class:'ol'},b);
  el('text',{x:stx+sw/2,y:sty+shh-22,"text-anchor":'middle',style:'font:700 16px Fredoka,sans-serif;fill:#800020'},b).textContent='₹'+(best?best.n:0).toLocaleString('en-IN');
  // the postmark
  const pm=g({opacity:.75},b);el('circle',{cx:760,cy:150,r:62,fill:'none',stroke:'#800020',"stroke-width":4},pm);el('circle',{cx:760,cy:150,r:50,fill:'none',stroke:'#800020',"stroke-width":2},pm);
  el('text',{x:760,y:140,"text-anchor":'middle',style:'font:700 15px Fredoka,sans-serif;fill:#800020;letter-spacing:1px'},pm).textContent='MARKET DAY';
  el('text',{x:760,y:168,"text-anchor":'middle',style:'font:600 15px Fredoka,sans-serif;fill:#800020'},pm).textContent=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}).toUpperCase();
  for(let k=0;k<4;k++)el('path',{d:`M${618} ${118+k*20} q20 -8 40 0 t40 0`,fill:'none',stroke:'#800020',"stroke-width":3},pm);
  // the address: where to play
  [380,450,520].forEach(y=>el('path',{d:`M640 ${y} H960`,stroke:'#d9c4a5',"stroke-width":2.5},b));
  el('text',{x:644,y:370,style:'font:500 24px Fredoka,sans-serif;fill:#5b3a2e'},b).textContent='To: someone who’d enjoy this';
  el('text',{x:644,y:440,style:'font:600 23px Fredoka,sans-serif;fill:#800020'},b).textContent='Play it at';
  el('text',{x:644,y:510,style:'font:600 22px Fredoka,sans-serif;fill:#800020'},b).textContent=location.host+'/';
  return b}
let fontCSS=null;
// the saved picture can't use the page's web font, so the font is folded into it
async function embedFont(){if(fontCSS!==null)return fontCSS;fontCSS='';
  try{const css=await (await fetch('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap')).text();
    const blocks=css.split('@font-face').filter(b=>/\/\* latin \*\//.test(css)&&/U\+0000-00FF/.test(b));
    const seen={};for(const blk of blocks){const u=(blk.match(/url\(([^)]+)\)/)||[])[1],w=(blk.match(/font-weight:\s*([\d ]+)/)||[])[1]||'400';if(!u)continue;
      if(!seen[u]){const bl=await (await fetch(u)).blob();seen[u]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(bl)})}
      fontCSS+=`@font-face{font-family:'Fredoka';font-weight:${w.trim()};src:url(${seen[u]}) format('woff2')}`}}catch(e){fontCSS=''}
  return fontCSS}
const EXPORT_CSS=`.ol{stroke:#5b3a2e;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}.chalk{font:600 26px Fredoka,sans-serif;fill:#fff8ea}.shimmer{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:18 60;opacity:.75}.petal{fill:#ff7aa2}.snow{fill:#fff}.glowl{opacity:.6}.fwk{opacity:${FEST?1:0}}.smoke circle,.steam circle{opacity:0}`;
async function toImage(svg,w,h){const c=svg.cloneNode(true);c.setAttribute('xmlns',NS);c.setAttribute('width',w);c.setAttribute('height',h);
  c.querySelectorAll('.snow,.petal,.conf').forEach(e=>{const y=PV.y+40+Math.random()*560;e.setAttribute(e.tagName==='rect'?'y':'cy',y)});
  const st=document.createElementNS(NS,'style');st.textContent=(await embedFont())+EXPORT_CSS;c.insertBefore(st,c.firstChild);
  const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(c));await img.decode();return img}
async function postcardBlob(){const front=$('#pf svg'),back=$('#pb svg'),W2=1200,H2=800,pad=50;
  const cv=document.createElement('canvas');cv.width=W2+pad*2;cv.height=H2*2+pad*3;const x=cv.getContext('2d');
  x.fillStyle=['','#dcefc9','#ffe1c2','#e3eef7'][DAY];x.fillRect(0,0,cv.width,cv.height);
  const [fi,bi]=await Promise.all([toImage(front,W2,H2),toImage(back,W2,H2)]);
  [[fi,pad],[bi,pad*2+H2]].forEach(([im,y])=>{x.save();x.fillStyle='#0003';x.fillRect(pad+8,y+12,W2,H2);x.fillStyle='#fffaf0';x.fillRect(pad-12,y-12,W2+24,H2+24);x.drawImage(im,pad,y,W2,H2);x.restore()});
  return new Promise(r=>cv.toBlob(r,'image/png'))}
function showPostcard(){const pf=$('#pf'),pb=$('#pb'),card=$('#card3d');pf.innerHTML='';pb.innerHTML='';pf.appendChild(postFront());pb.appendChild(postBack());card.classList.remove('flip');
  const flip=()=>{card.classList.toggle('flip');sfx('tap')};card.onclick=flip;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
  const pa=$('#pa');pa.innerHTML='';const add=(t,fn,soft)=>{const b=document.createElement('button');b.className='btn'+(soft?' soft':'');b.type='button';b.textContent=t;b.onclick=()=>{sfx('tap');fn(b)};pa.appendChild(b)};
  const name='market-day-postcard.png';
  add('Save postcard',async b=>{b.textContent='Making it…';try{const bl=await postcardBlob(),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Postcard saved')}catch(e){toast('Sorry, the postcard couldn’t be saved')}b.textContent='Save postcard'});
  if(navigator.canShare)add('Share',async b=>{try{const bl=await postcardBlob(),file=new File([bl],name,{type:'image/png'});if(navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'Market Day',text:'My day minding a stall at the hill market'});else toast('Sharing isn’t available here. Try Save postcard.')}catch(e){}},true);
  add('Back to the ledger',()=>$('#post').classList.remove('on'),true);
  $('#post').classList.add('on');sfx('clink');embedFont()}

/* ---------- good morning ---------- */
clock(8,30);scrollTo(focus(),true);
startBest();
function morning(){const sp={t:'Set prices',soft:true,fn:()=>showPrices()};
  const other=[1,2,3].filter(d=>d!==DAY&&unlocked(d));
  const days=other.length?{t:'Other days',soft:true,fn:()=>talk('Riya','#800020','#fff8ea','Which market day?',other.map(d=>({t:DAYNAME[d]+' →',fn:()=>toDay(d)})).concat([{t:'Stay here',soft:true,fn:morning}]))}:null;
  if(WINTER)return talk('Riya','#800020','#fff8ea','Brr, winter market! Kiko’s back from the first day and Bo from the festival. Lumi and Gus are hibernating. Set the prices, choose the sign, and decide whether to bundle '+HOT.word+' with '+NUTS.word+'.',[{t:'Open the stall',fn:run},sp,{t:'Who’s coming?',soft:true,fn:()=>talk('Riya','#800020','#fff8ea','Milo the ibex, Dot the snow partridge and Kiko the yak this morning. After lunch, Tess the fox and Bo the snow leopard cub.',[{t:'Open the stall',fn:run},sp])}].concat(days?[days]:[]));
  if(DAY===2)return talk('Riya','#800020','#fff8ea','Happy festival day! Pip and Wren are back, and three new faces are coming. Set the prices, choose the sign, and decide whether to put out free tastes.',[{t:'Open the stall',fn:run},sp,{t:'Who’s coming?',soft:true,fn:()=>talk('Riya','#800020','#fff8ea','Pip the goat and Lumi the marmot this morning, then Bo the snow leopard cub. After lunch, Gus the black bear and Wren the red panda. Careful: Gus loves honey a little too much.',[{t:'Open the stall',fn:run},sp])}].concat(days?[days]:[]));
  const b=[{t:'Open the stall',fn:run},sp,{t:'Who’s coming?',soft:true,fn:()=>talk('Riya','#800020','#fff8ea','Pip the goat, Juno the monal, Nell the pika, Kiko the yak and Wren the red panda. Each one has a limit, and each one shops a little differently. Watch closely.',[{t:'Open the stall',fn:run},sp])}];
  if(days)b.push(days);
  talk('Riya','#800020','#fff8ea','Morning! The hill market opens at nine and you’re minding my stall today. Set the prices, choose what the chalkboard says, then open up.',b)}
setTimeout(()=>{scrollTo(focus());morning()},500);
addEventListener('resize',()=>scrollTo(focus(),true));
})();
